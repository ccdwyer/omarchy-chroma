[package]
name = "chromad"
version = "1.0.0"
edition = "2021"
description = "Chroma capture daemon: region frames, k-means palette, OCR/QR, calibration"
license = "MIT"
publish = false

[[bin]]
name = "chromad"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
rustix = { version = "0.38", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
